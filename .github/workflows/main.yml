name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: coworking_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup environment
        run: |
          echo "DATABASE_URL=postgresql://test_user:test_password@localhost:5432/coworking_test" > .env
          echo "PORT=3000" >> .env
          echo "BCRYPT_ROUNDS=10" >> .env
          echo "NODE_ENV=test" >> .env

      - name: Run Prisma migrations
        run: npm run prisma:migrate -- --skip-generate

      - name: Lint TypeScript code
        run: npm run lint
        continue-on-error: false

      - name: Compile TypeScript
        run: npm run build
        continue-on-error: false

      - name: Run unit tests (Jest)
        run: npm test -- --coverage --passWithNoTests
        continue-on-error: false

      - name: Run BDD tests (Cucumber)
        run: npm run test:e2e
        continue-on-error: false

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: reports/

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for vulnerabilities
        run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    needs: [quality, security]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build application
        run: npm run build

      - name: Archive build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: dist/

  notify:
    needs: [quality, security, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Pipeline Status
        run: |
          if [ "${{ needs.quality.result }}" == "success" ] && \
             [ "${{ needs.security.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "❌ Pipeline failed"
            exit 1
          fi
