# Pipeline de Integracion Continua (progXP.pdf seccion 3).
#
# Practica XP: ningun cambio se integra sin pasar linter, compilacion estricta,
# pruebas unitarias y pruebas BDD. La suite corre sobre repositorios en
# memoria, asi que no necesita levantar PostgreSQL.

name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    name: Lint, compilacion y pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El cliente tipado de Prisma se genera a partir del schema; hace falta
      # para que `tsc` resuelva los tipos de src/db.ts. No requiere base de datos.
      - name: Generar cliente de Prisma
        run: npm run prisma:generate

      - name: Verificacion de linters
        run: npm run lint

      - name: Compilacion de TypeScript (tipos estrictos)
        run: npm run typecheck

      - name: Pruebas unitarias (Jest) con cobertura
        run: npm run test:coverage

      - name: Pruebas BDD (Cucumber)
        run: npm run test:e2e

      - name: Compilar a dist/
        run: npm run build

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            reports/
            coverage/
          if-no-files-found: ignore

  security:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Buscar vulnerabilidades conocidas
        run: npm audit --audit-level=high
        continue-on-error: true
